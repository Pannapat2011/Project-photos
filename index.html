<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบฝากรูปภาพองค์กร - บจก.คาเคา ซีเอสอี</title>
    <style>
        /* =========================================
           UI Design: iOS 27 Pro Max (Liquid Glass)
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 20px; color: #1C1C1E; -webkit-font-smoothing: antialiased;
            background-color: #f2f5f8;
            background-image: 
                radial-gradient(at 0% 0%, rgba(169, 193, 255, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(132, 250, 176, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 185, 201, 0.3) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(252, 203, 144, 0.3) 0px, transparent 50%);
            background-attachment: fixed; background-size: cover;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 32px; padding: 40px; width: 100%; max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 1); border-left: 1px solid rgba(255, 255, 255, 1);
            text-align: center;
        }

        .header img { height: 90px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .header h1 { font-size: 24px; margin: 0 0 5px 0; color: #1C1C1E; }
        .header p { margin: 0 0 30px 0; color: #5A5A5E; font-size: 15px; }

        /* พื้นที่อัปโหลดรูป */
        .drop-zone {
            border: 2px dashed #007AFF; border-radius: 24px; padding: 40px 20px;
            background: rgba(0, 122, 255, 0.03); cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .drop-zone:hover { background: rgba(0, 122, 255, 0.08); transform: scale(1.02); }
        .drop-zone.dragover { background: rgba(0, 122, 255, 0.15); border-color: #0056b3; }
        .drop-zone svg { width: 50px; height: 50px; fill: #007AFF; margin-bottom: 10px; }
        .drop-zone span { display: block; color: #007AFF; font-weight: 500; font-size: 16px; }
        .drop-zone p { color: #8E8E93; font-size: 13px; margin-top: 5px; }
        
        #file-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* ส่วนแสดงผลลัพธ์ */
        .result-area { display: none; margin-top: 30px; animation: slideUp 0.4s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .preview-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .url-box {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 16px; padding: 5px; margin-bottom: 15px;
        }
        .url-input {
            flex: 1; border: none; background: transparent; padding: 12px 15px;
            font-family: 'Prompt', sans-serif; font-size: 14px; color: #1C1C1E; outline: none;
        }
        .btn-copy {
            background: #007AFF; color: white; border: none; border-radius: 12px;
            padding: 12px 20px; font-family: 'Prompt'; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-copy:hover { background: #0056b3; }

        .btn-reset {
            background: transparent; color: #FF3B30; border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 99px; padding: 10px 24px; font-family: 'Prompt'; font-weight: 500; cursor: pointer; transition: 0.2s;
            width: 100%; font-size: 16px;
        }
        .btn-reset:hover { background: #FF3B30; color: white; }

        /* Loading Spinner */
        .loader-container { display: none; margin-top: 20px; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(0, 122, 255, 0.2);
            border-top: 4px solid #007AFF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #007AFF; font-weight: 500; margin-top: 10px; font-size: 15px; }

        /* Toasts */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            min-width: 250px; padding: 16px 20px; border-radius: 20px; color: #1C1C1E; font-size: 14px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: slideDown 0.4s forwards; border-left: 5px solid #34C759;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="upload-container">
        <div class="header">
            <img src="https://img2.pic.in.th/image7e25937f6259175c.png" alt="โลโก้บริษัท" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
            <h1>ระบบฝากรูปภาพส่วนกลาง</h1>
            <p>บจก.คาเคา ซีเอสอี (เชื่อมต่อ Google Drive อัตโนมัติ)</p>
        </div>

        <!-- โซนอัปโหลด -->
        <div class="drop-zone" id="drop-zone">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <span>แตะเพื่อเลือกรูปภาพ หรือ ลากไฟล์มาวางที่นี่</span>
            <p>รองรับไฟล์ JPG, PNG, WEBP (ระบบจะทำการบีบอัดให้อัตโนมัติ)</p>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- หน้าต่างกำลังโหลด -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <div class="loading-text" id="loading-text">กำลังประมวลผล...</div>
        </div>

        <!-- หน้าต่างแสดงผลลัพธ์ -->
        <div class="result-area" id="result-area">
            <img src="" alt="ภาพตัวอย่าง" class="preview-img" id="preview-img">
            <p style="text-align: left; margin: 0 0 5px 5px; font-weight: 500; font-size: 14px;">Direct Link (นำไปใช้วางในระบบคลังสินค้าได้ทันที):</p>
            <div class="url-box">
                <input type="text" id="url-output" class="url-input" readonly>
                <button class="btn-copy" onclick="copyUrl()">คัดลอกลิงก์</button>
            </div>
            <button class="btn-reset" onclick="resetForm()">อัปโหลดไฟล์ใหม่</button>
        </div>
    </div>

    <script>
        // นำ URL ที่ได้รับมอบหมายมาอัปเดตเรียบร้อยแล้ว
        const UPLOAD_API_URL = 'https://script.google.com/macros/s/AKfycbw53T_Bq7bIIRbwEt1_vYR7h07FRla3BxgVhCgeYL-uglvwaci86WP0k_TH3jymnprLTw/exec';

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        // ฟังก์ชันแสดงการแจ้งเตือน
        function showToast(title, message) {
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `<strong style="color:#1C1C1E; font-size: 15px;">${title}</strong><br><span style="color:#5A5A5E; font-size: 14px;">${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // เอฟเฟกต์สำหรับการ Drag & Drop ลากไฟล์มาวาง
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleUpload();
            }
        });
        fileInput.addEventListener('change', handleUpload);

        // ฟังก์ชันบีบอัดรูปภาพเพื่อประสิทธิภาพสูงสุด
        function compressImage(file, maxWidth = 1024, maxHeight = 1024, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/webp', quality);
                        const splitData = dataUrl.split(',');
                        resolve({ base64Data: splitData[1], mimeType: splitData[0].match(/:(.*?);/)[1] });
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        // ฟังก์ชันดำเนินการอัปโหลดไฟล์
        async function handleUpload() {
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            
            // ปรับเปลี่ยนส่วนแสดงผลเพื่อแจ้งให้ผู้ใช้งานทราบ
            dropZone.style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loading-text').innerText = "กำลังประมวลผลและบีบอัดรูปภาพ...";

            try {
                // แสดงภาพตัวอย่าง
                const previewUrl = URL.createObjectURL(file);
                document.getElementById('preview-img').src = previewUrl;

                // ดำเนินการบีบอัด
                const compressed = await compressImage(file);
                const payload = {
                    fileName: "CSE_IMG_" + new Date().getTime() + ".webp",
                    mimeType: compressed.mimeType,
                    base64Data: compressed.base64Data
                };

                document.getElementById('loading-text').innerText = "กำลังส่งข้อมูลไปยัง Google Drive...";

                // ส่งข้อมูลไปยังระบบหลังบ้าน
                const response = await fetch(UPLOAD_API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('result-area').style.display = 'block';
                    document.getElementById('url-output').value = result.url;
                    showToast('อัปโหลดเสร็จสิ้น', 'ดำเนินการบันทึกรูปภาพลงฐานข้อมูลแล้ว');
                } else {
                    throw new Error(result.message);
                }

            } catch (error) {
                alert('เกิดข้อผิดพลาดในการดำเนินการ: ' + error.message);
                resetForm();
            }
        }

        // ฟังก์ชันสำหรับคัดลอกลิงก์ที่ได้รับจากระบบ
        function copyUrl() {
            const copyText = document.getElementById("url-output");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            showToast('คัดลอกสำเร็จ', 'ระบบได้ทำการคัดลอกลิงก์ไปยังคลิปบอร์ดแล้ว');
        }

        // ฟังก์ชันตั้งค่าเริ่มต้นเพื่อรองรับการอัปโหลดไฟล์ถัดไป
        function resetForm() {
            fileInput.value = '';
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            dropZone.style.display = 'block';
        }
    </script>
</body>
</html>
